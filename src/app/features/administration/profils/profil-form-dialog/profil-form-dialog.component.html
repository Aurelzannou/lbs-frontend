<div class="dialog-wrapper">
  <div class="glass-overlay"></div>
  
  <mat-card class="form-card">
    <mat-card-header class="form-header">
      <div class="header-content">
        <div class="title-with-icon">
          <div class="icon-box" [ngClass]="isEdit ? 'edit-mode' : 'create-mode'">
            <mat-icon></mat-icon>
          </div>
          <div class="title-text">
            <h3>{{ isEdit ? 'Modifier le' : 'Nouveau' }} Profil</h3>
            <p class="subtitle">{{ isEdit ? 'Mise à jour des informations' : 'Définition d\'un nouveau profil utilisateur' }}</p>
          </div>
        </div>
        <button mat-icon-button (click)="onCancel()" class="close-btn">
          <mat-icon></mat-icon>
        </button>
      </div>
    </mat-card-header>

    <mat-card-content class="form-body">
      <form [formGroup]="form" class="professional-form">
        <div class="form-row">
          <div class="form-field full-width">
            <label class="field-label">Code du Profil</label>
            <mat-form-field appearance="outline" class="full-width">
              <nb-icon matPrefix icon="hash-outline" pack="eva"></nb-icon>
              <input matInput 
                     formControlName="code" 
                     placeholder="Ex: ADMIN, LECTEUR, GESTIONNAIRE..."
                     style="text-transform: uppercase"
                     >
            </mat-form-field>
            <div class="field-error" *ngIf="form.get('code')?.invalid && form.get('code')?.touched">
              <span *ngIf="form.get('code')?.errors?.['required']">Ce champ est obligatoire</span>
              <span *ngIf="form.get('code')?.errors?.['maxlength']">Maximum 20 caractères</span>
            </div>
          </div>
        </div>

        <div class="form-row">
          <div class="form-field full-width">
            <label class="field-label">Libellé Complet</label>
            <mat-form-field appearance="outline" class="full-width">
              <nb-icon matPrefix icon="text-outline" pack="eva"></nb-icon>
              <input matInput 
                     formControlName="libelle" 
                     placeholder="Ex: Administrateur du système"
                     >
            </mat-form-field>
            <div class="field-error" *ngIf="form.get('libelle')?.invalid && form.get('libelle')?.touched">
              <span *ngIf="form.get('libelle')?.errors?.['required']">Ce champ est obligatoire</span>
              <span *ngIf="form.get('libelle')?.errors?.['maxlength']">Maximum 100 caractères</span>
            </div>
          </div>
        </div>
      </form>
    </mat-card-content>

    <mat-card-actions class="form-footer">
      <div class="footer-actions">
        <button mat-button
                (click)="onCancel()"
                [disabled]="loading"
                class="cancel-btn">
          Annuler
        </button>
        <button mat-button
                status="primary"
                (click)="onSubmit()"
                [disabled]="form.invalid || loading"
                class="submit-btn shadow-btn">
          <nb-icon icon="save-outline" *ngIf="!loading"></nb-icon>
          {{ isEdit ? 'Mettre à jour' : 'Enregistrer' }}
        </button>
      </div>
    </mat-card-actions>
  </mat-card>

</div>
