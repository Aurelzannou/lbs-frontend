<div class="dialog-wrapper">
  <div class="glass-overlay"></div>
  
  <mat-card class="form-card">
    <mat-card-header class="form-header">
      <div class="header-content">
        <div class="title-with-icon">
          <div class="icon-box" [ngClass]="isEdit ? 'edit-mode' : 'create-mode'">
            <mat-icon></mat-icon>
          </div>
          <div class="title-text">
            <h3>{{ isEdit ? 'Modifier le' : 'Nouveau' }} Menu</h3>
            <p class="subtitle">{{ isEdit ? 'Mise à jour des informations' : 'Configuration de l\'entrée de navigation' }}</p>
          </div>
        </div>
        <button mat-icon-button (click)="onCancel()" class="close-btn">
          <mat-icon></mat-icon>
        </button>
      </div>
    </mat-card-header>

    <mat-card-body class="form-body">
      <form [formGroup]="form" class="professional-form">
        <div class="form-row">
          <div class="form-field col-6">
            <label class="field-label">Titre du Menu</label>
            <mat-form-field appearance="outline" class="full-width">
              <nb-icon matPrefix icon="text-outline" pack="eva"></mat-icon>
              <input matInput 
                     formControlName="titre" 
                     placeholder="Ex: Tableau de bord"
                     >
            </mat-form-field>
          </div>
          <div class="form-field col-6">
            <label class="field-label">Code (Unique)</label>
            <mat-form-field appearance="outline" class="full-width">
              <nb-icon matPrefix icon="hash-outline" pack="eva"></mat-icon>
              <input matInput 
                     formControlName="code" 
                     placeholder="Ex: DASHBOARD"
                     style="text-transform: uppercase"
                     >
            </mat-form-field>
          </div>
        </div>

        <div class="form-row">
          <div class="form-field full-width">
            <label class="field-label">Chemin (URL)</label>
            <mat-form-field appearance="outline" class="full-width">
              <nb-icon matPrefix icon="link-outline" pack="eva"></mat-icon>
              <input matInput 
                     formControlName="path" 
                     placeholder="Ex: /referentiel/niveaux"
                     >
            </mat-form-field>
            <p class="field-hint">Laissez vide si c'est un menu parent (groupe).</p>
          </div>
        </div>

        <div class="form-row">
          <div class="form-field col-6">
            <label class="field-label">Ordre</label>
            <mat-form-field appearance="outline" class="full-width">
              <nb-icon matPrefix icon="layers-outline" pack="eva"></mat-icon>
              <input matInput 
                     type="number" 
                     formControlName="ordre" 
                     >
            </mat-form-field>
          </div>
          <div class="form-field col-6">
            <label class="field-label">Menu Parent</label>
            <ng-select [items]="parentMenus"
                       bindLabel="titre"
                       bindValue="id"
                       formControlName="menuEnfantId"
                       placeholder="Aucun (Racine)"
                       class="custom-ng-select">
              <ng-template ng-option-tmp let-item="item">
                {{ item.titre }} <small class="text-muted">({{ item.code }})</small>
              </ng-template>
            </ng-select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-field full-width">
            <label class="field-label">Profils autorisés</label>
            <div class="profils-selection-grid">
              <div class="profil-item" *ngFor="let p of allProfils">
                <nb-checkbox [checked]="isProfilSelected(p.id)"
                             (checkedChange)="toggleProfil(p.id, $event)">
                  {{ p.libelle }}
                </nb-checkbox>
              </div>
            </div>
          </div>
        </div>
      </form>
    </mat-card-content>

    <mat-card-footer class="form-footer">
      <div class="footer-actions">
        <button mat-button
                (click)="onCancel()" 
                [disabled]="loading"
                class="cancel-btn">
          Annuler
        </button>
        <button mat-button 
                status="primary"
                (click)="onSubmit()" 
                [disabled]="form.invalid || loading"
                class="submit-btn shadow-btn">
          <nb-icon icon="save-outline" *ngIf="!loading"></mat-icon>
          {{ isEdit ? 'Mettre à jour' : 'Enregistrer' }}
        </button>
      </div>
    </mat-card-actions>
  </mat-card>
</div>
