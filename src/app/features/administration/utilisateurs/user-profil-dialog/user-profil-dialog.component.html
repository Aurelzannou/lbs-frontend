<div class="rfm-dialog">
  <div class="rfm-card">

    <div class="rfm-header">
      <div class="rfm-header-inner">
        <div class="rfm-title-group">
          <div class="rfm-icon-box edit">
            <mat-icon>manage_accounts</mat-icon>
          </div>
          <div>
            <h3 class="rfm-title">Assigner des Profils</h3>
            <p class="rfm-subtitle">Utilisateur : {{ data.prenom }} {{ data.nom }}</p>
          </div>
        </div>
        <button mat-icon-button class="rfm-close" (click)="onCancel()">
          <mat-icon>close</mat-icon>
        </button>
      </div>
    </div>

    <div class="rfm-body">
      <div class="rfm-form">

        <div class="rfm-row">
          <div class="rfm-field rfm-select">
            <span class="rfm-label">Sélection des Profils</span>
            <ng-select [items]="allProfils"
                       [(ngModel)]="selectedProfilCodes"
                       [multiple]="true"
                       bindLabel="libelle"
                       bindValue="code"
                       placeholder="Rechercher des profils..."
                       [searchable]="true">
              <ng-template ng-option-tmp let-item="item">
                <div class="profil-option">
                  <span class="profil-label">{{ item.libelle }}</span>
                  <small class="profil-code">{{ item.code }}</small>
                </div>
              </ng-template>
            </ng-select>
            <p class="field-hint">Tous les droits associés à ces profils seront octroyés à l'utilisateur.</p>
          </div>
        </div>

      </div>
    </div>

    <div class="rfm-footer">
      <div class="rfm-actions">
        <button mat-button class="rfm-cancel" (click)="onCancel()" [disabled]="loading">
          Annuler
        </button>
        <button mat-flat-button class="rfm-submit" (click)="onSubmit()" [disabled]="loading">
          <mat-icon *ngIf="!loading">save</mat-icon>
          Enregistrer les modifications
        </button>
      </div>
    </div>

  </div>
</div>
