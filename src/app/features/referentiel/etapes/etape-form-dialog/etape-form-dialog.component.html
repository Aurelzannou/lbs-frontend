<div class="dialog-wrapper">
  <div class="glass-overlay"></div>
  
  <mat-card class="form-card">
    <mat-card-header class="form-header">
      <div class="header-content">
        <div class="title-with-icon">
          <div class="icon-box" [ngClass]="isEdit ? 'edit-mode' : 'create-mode'">
            <mat-icon>account_tree</mat-icon>
          </div>
          <div class="title-text">
            <h3>{{ isEdit ? 'Modifier l\'' : 'Nouvelle' }} Étape</h3>
            <p class="subtitle">{{ isEdit ? 'Mise à jour des informations' : 'Définition d\'une nouvelle étape administrative' }}</p>
          </div>
        </div>
        <button mat-icon-button (click)="onCancel()" class="close-btn">
          <mat-icon>close</mat-icon>
        </button>
      </div>
    </mat-card-header>

    <mat-card-content class="form-body">
      <form [formGroup]="form" class="professional-form">
        <div class="form-row">
          <div class="form-field full-width">
            <label class="field-label">Code de l'étape</label>
            <mat-form-field appearance="outline" class="full-width">
              <mat-icon matPrefix>tag</mat-icon>
              <input matInput 
                     formControlName="code" 
                     placeholder="Ex: INSCRIPTION, VALIDATION..."
                     style="text-transform: uppercase"
                     >
            </mat-form-field>
            <div class="field-error" *ngIf="form.get('code')?.invalid && form.get('code')?.touched">
              <span *ngIf="form.get('code')?.errors?.['required']">Ce champ est obligatoire</span>
            </div>
          </div>
        </div>

        <div class="form-row">
          <div class="form-field full-width">
            <label class="field-label">Libellé</label>
            <mat-form-field appearance="outline" class="full-width">
              <mat-icon matPrefix>notes</mat-icon>
              <input matInput 
                     formControlName="libelle" 
                     placeholder="Ex: Inscription des élèves"
                     >
            </mat-form-field>
            <div class="field-error" *ngIf="form.get('libelle')?.invalid && form.get('libelle')?.touched">
              <span *ngIf="form.get('libelle')?.errors?.['required']">Ce champ est obligatoire</span>
            </div>
          </div>
        </div>

        <div class="form-row">
          <div class="form-field full-width">
            <label class="field-label">Description (optionnel)</label>
            <mat-form-field appearance="outline" class="full-width">
              <mat-icon matPrefix>subject</mat-icon>
              <textarea matInput
                        formControlName="description"
                        placeholder="Détails sur cette étape..."
                        rows="3">
              </textarea>
            </mat-form-field>
          </div>
        </div>
      </form>
    </mat-card-content>

    <mat-card-actions class="form-footer">
      <div class="footer-actions">
        <button mat-button
                (click)="onCancel()" 
                [disabled]="loading"
                class="cancel-btn">
          Annuler
        </button>
        <button mat-flat-button
                (click)="onSubmit()"
                [disabled]="form.invalid || loading"
                class="submit-btn shadow-btn">
          <mat-icon *ngIf="!loading">save</mat-icon>
          {{ isEdit ? 'Mettre à jour' : 'Enregistrer' }}
        </button>
      </div>
    </mat-card-actions>
  </mat-card>
</div>
