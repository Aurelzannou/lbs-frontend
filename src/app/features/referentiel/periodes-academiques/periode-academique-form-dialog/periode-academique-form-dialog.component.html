<div class="dialog-container">
  <div class="dialog-header">
    <h3>{{ isEdit ? 'Modifier la Période' : 'Nouvelle Période' }}</h3>
    <button class="close-btn" (click)="onCancel()">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path d="M18 6L6 18M6 6l12 12"/>
      </svg>
    </button>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="dialog-content">
    <div class="form-grid">
      <!-- Année Scolaire -->
      <div class="form-field">
        <label>Année Scolaire</label>
        <ng-select
          [items]="anneesScolaires"
          bindLabel="code"
          bindValue="id"
          formControlName="anneeScolaireId"
          placeholder="Sélectionner l'année"
          class="custom-ng-select"
          [loading]="loading">
        </ng-select>
      </div>

      <!-- Code -->
      <div class="form-field">
        <label>Code</label>
        <input matInput placeholder="Ex: TRIM1" formControlName="code" 
               >
      </div>

      <!-- Libellé -->
      <div class="form-field">
        <label>Libellé</label>
        <input matInput placeholder="Ex: Premier Trimestre" formControlName="libelle"
               >
      </div>

      <!-- Dates -->
      <div class="form-row">
        <div class="form-field">
          <label>Date Début</label>
          <input matInput [nbDatepicker]="pickerDebut" formControlName="dateDebut" placeholder="jj/mm/aaaa">
          <nb-datepicker #pickerDebut></nb-datepicker>
        </div>
        <div class="form-field">
          <label>Date Fin</label>
          <input matInput [nbDatepicker]="pickerFin" formControlName="dateFin" placeholder="jj/mm/aaaa">
          <nb-datepicker #pickerFin></nb-datepicker>
        </div>
      </div>
    </div>
  </form>

  <div class="dialog-footer">
    <button mat-icon-button (click)="onCancel()" [disabled]="saving">Annuler</button>
    <button mat-button status="primary" (click)="onSubmit()" [disabled]="form.invalid || saving">
      {{ isEdit ? 'Enregistrer' : 'Créer la période' }}
    </button>
  </div>
</div>
