<div class="rfm-dialog">
  <div class="rfm-card">

    <div class="rfm-header">
      <div class="rfm-header-inner">
        <div class="rfm-title-group">
          <div class="rfm-icon-box" [ngClass]="isEdit ? 'edit' : 'create'">
            <mat-icon>description</mat-icon>
          </div>
          <div>
            <h3 class="rfm-title">{{ isEdit ? 'Modifier le Type d\'Acte' : 'Nouveau Type d\'Acte' }}</h3>
            <p class="rfm-subtitle">{{ isEdit ? 'Mise à jour des informations' : 'Nouveau type d\'acte administratif' }}</p>
          </div>
        </div>
        <button mat-icon-button class="rfm-close" (click)="onCancel()">
          <mat-icon>close</mat-icon>
        </button>
      </div>
    </div>

    <div class="rfm-body">
      <form [formGroup]="form" class="rfm-form">

        <div class="rfm-row">
          <div class="rfm-field">
            <span class="rfm-label">Code</span>
            <mat-form-field appearance="outline">
              <mat-icon matPrefix>tag</mat-icon>
              <input matInput formControlName="code" placeholder="Ex: NAISS">
            </mat-form-field>
            <div class="rfm-error" *ngIf="form.get('code')?.invalid && form.get('code')?.touched">
              Ce champ est obligatoire
            </div>
          </div>
        </div>

        <div class="rfm-row">
          <div class="rfm-field">
            <span class="rfm-label">Libellé</span>
            <mat-form-field appearance="outline">
              <mat-icon matPrefix>notes</mat-icon>
              <input matInput formControlName="libelle" placeholder="Ex: Acte de Naissance">
            </mat-form-field>
            <div class="rfm-error" *ngIf="form.get('libelle')?.invalid && form.get('libelle')?.touched">
              Ce champ est obligatoire
            </div>
          </div>
        </div>

      </form>
    </div>

    <div class="rfm-footer">
      <div class="rfm-actions">
        <button mat-button class="rfm-cancel" (click)="onCancel()" [disabled]="saving">
          Annuler
        </button>
        <button mat-flat-button class="rfm-submit" (click)="onSubmit()" [disabled]="form.invalid || saving">
          <mat-icon *ngIf="!saving">save</mat-icon>
          {{ isEdit ? 'Mettre à jour' : 'Enregistrer' }}
        </button>
      </div>
    </div>

  </div>
</div>
