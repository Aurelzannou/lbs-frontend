<mat-card>
  <mat-card-header class="dialog-header">
    <div class="header-content">
      <mat-icon></mat-icon>
      <span>{{ isEdit ? 'Modifier' : 'Nouvelle' }} Année Scolaire</span>
    </div>
    <button class="close-btn" (click)="onCancel()">
      <mat-icon></mat-icon>
    </button>
  </mat-card-header>

  <mat-card-content>
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-container">
      <div class="form-row">
        <div class="form-field full">
          <label>Code <span class="required">*</span></label>
          <mat-form-field appearance="outline" class="full-width">
            <nb-icon matPrefix icon="hash-outline"></nb-icon>
            <input matInput formControlName="code" placeholder="Ex: 2023-2024">
          </mat-form-field>
        </div>
      </div>

      <div class="form-row">
        <div class="form-field full">
          <label>Libellé <span class="required">*</span></label>
          <mat-form-field appearance="outline" class="full-width">
            <nb-icon matPrefix icon="text-outline"></nb-icon>
            <input matInput formControlName="libelle" placeholder="Ex: Année Scolaire 2023-2024">
          </mat-form-field>
        </div>
      </div>

      <div class="form-row two-cols">
        <div class="form-field">
          <label>Date Début <span class="required">*</span></label>
          <input matInput type="date" formControlName="dateDebut">
        </div>
        <div class="form-field">
          <label>Date Fin <span class="required">*</span></label>
          <input matInput type="date" formControlName="dateFin">
        </div>
      </div>

      <div class="form-row toggle-row">
        <label>Statut Actif</label>
        <nb-toggle formControlName="actif" status="success"></nb-toggle>
      </div>
    </form>
  </mat-card-content>

  <mat-card-actions class="dialog-footer">
    <button mat-button status="basic" (click)="onCancel()" [disabled]="loading">Annuler</button>
    <button mat-button status="primary" (click)="onSubmit()" [disabled]="form.invalid || loading">
      {{ isEdit ? 'Mettre à jour' : 'Enregistrer' }}
    </button>
  </mat-card-actions>
</mat-card>
