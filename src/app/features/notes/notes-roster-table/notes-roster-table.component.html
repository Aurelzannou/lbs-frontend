<div class="roster-wrapper">
  <div class="roster-search">
    <mat-icon>search</mat-icon>
    <input
      type="text"
      [(ngModel)]="recherche"
      placeholder="Rechercher un élève..."
      [disabled]="eleves.length === 0"
    />
  </div>

  <div class="roster-table-wrapper">
    <table class="roster-table">
      <thead>
        <tr>
          <th class="col-eleve">Élève</th>
          <th class="col-note">Interrogation</th>
          <th class="col-note">1er Devoir</th>
          <th class="col-note">2e Devoir</th>
          <th class="col-moyenne">Moyenne</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let el of elevesFiltres">
          <td class="col-eleve">{{ el.nom }} {{ el.prenom }}</td>
          <td class="col-note">
            <input
              type="number"
              min="0"
              max="20"
              step="0.25"
              [(ngModel)]="el.interrogation"
              (ngModelChange)="onValeurChange(el)"
              [disabled]="readonly"
            />
          </td>
          <td class="col-note">
            <input
              type="number"
              min="0"
              max="20"
              step="0.25"
              [(ngModel)]="el.devoir1"
              (ngModelChange)="onValeurChange(el)"
              [disabled]="readonly"
            />
          </td>
          <td class="col-note">
            <input
              type="number"
              min="0"
              max="20"
              step="0.25"
              [(ngModel)]="el.devoir2"
              (ngModelChange)="onValeurChange(el)"
              [disabled]="readonly"
            />
          </td>
          <td class="col-moyenne">
            <span *ngIf="calculerMoyenne(el) !== null; else pasDeNote" class="moyenne-value">
              {{ calculerMoyenne(el) | number: '1.2-2' }}
            </span>
            <ng-template #pasDeNote><span class="text-muted">—</span></ng-template>
          </td>
        </tr>
        <tr *ngIf="eleves.length === 0">
          <td colspan="5" class="empty-row">Aucun élève dans cette classe.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
