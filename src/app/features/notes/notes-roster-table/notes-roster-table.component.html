<div class="roster-wrapper">
  <div class="roster-toolbar">
    <div class="roster-search">
      <mat-icon>search</mat-icon>
      <input
        type="text"
        [(ngModel)]="recherche"
        placeholder="Rechercher un élève..."
        [disabled]="eleves.length === 0"
      />
    </div>

    <div class="interro-actions" *ngIf="!readonly && allowAddInterrogation">
      <button
        type="button"
        class="btn-interro"
        (click)="ajouterInterrogation()"
        [disabled]="nombreInterrogations >= maxInterrogations"
        matTooltip="Maximum {{ maxInterrogations }} interrogations"
      >
        <mat-icon>add</mat-icon>
        Ajouter une interrogation
      </button>
      <button
        type="button"
        class="btn-interro btn-remove"
        (click)="supprimerDerniereInterrogation()"
        [disabled]="
          nombreInterrogations <= 1 ||
          derniereInterrogationRemplie ||
          interrogationVerrouillee(nombreInterrogations)
        "
        [matTooltip]="
          interrogationVerrouillee(nombreInterrogations)
            ? 'Impossible : cette colonne est verrouillée'
            : derniereInterrogationRemplie
              ? 'Impossible : des notes existent déjà dans cette colonne'
              : 'Retirer la dernière colonne d\'interrogation'
        "
      >
        <mat-icon>remove</mat-icon>
      </button>
    </div>
  </div>

  <div class="roster-table-wrapper">
    <table class="roster-table">
      <thead>
        <tr>
          <th class="col-eleve">Élève</th>
          <th class="col-note" *ngFor="let i of interrogationIndices">
            <div class="col-header-lock">
              <span>Interrogation {{ i + 1 }}</span>
              <mat-icon
                *ngIf="interrogationValidee(i + 1)"
                class="icon-lock icon-validee"
                matTooltip="Validée par l'administration"
              >
                check_circle
              </mat-icon>
              <mat-icon
                *ngIf="interrogationEnAttenteValidation(i + 1)"
                class="icon-lock icon-attente"
                matTooltip="Verrouillée, en attente de validation admin"
              >
                hourglass_top
              </mat-icon>
              <button
                *ngIf="!readonly && verrouillageActifPourEdition && interrogationEstProchaine(i + 1)"
                type="button"
                class="btn-terminer"
                [disabled]="verrouillageEnCours || !peutVerrouillerInterrogation(i + 1)"
                (click)="onVerrouillerInterrogation(i + 1)"
                [matTooltip]="
                  peutVerrouillerInterrogation(i + 1)
                    ? 'Verrouiller cette colonne : plus aucune modification possible ensuite'
                    : 'L\'interrogation ' + i + ' doit d\'abord être validée par l\'administration'
                "
              >
                <mat-icon>lock_open</mat-icon>
                Terminer
              </button>
            </div>
          </th>
          <th class="col-note">
            <div class="col-header-lock">
              <span>1er Devoir</span>
              <mat-icon *ngIf="devoirValide(1)" class="icon-lock icon-validee" matTooltip="Validé par l'administration">check_circle</mat-icon>
              <mat-icon *ngIf="devoirEnAttenteValidation(1)" class="icon-lock icon-attente" matTooltip="Verrouillé, en attente de validation admin">hourglass_top</mat-icon>
              <button
                *ngIf="!readonly && verrouillageActifPourEdition && devoirEstProchain(1)"
                type="button"
                class="btn-terminer"
                [disabled]="verrouillageEnCours || !peutVerrouillerDevoir(1)"
                (click)="onVerrouillerDevoir(1)"
                matTooltip="Verrouiller ce devoir : plus aucune modification possible ensuite"
              >
                <mat-icon>lock_open</mat-icon>
                Terminer
              </button>
            </div>
          </th>
          <th class="col-note">
            <div class="col-header-lock">
              <span>2e Devoir</span>
              <mat-icon *ngIf="devoirValide(2)" class="icon-lock icon-validee" matTooltip="Validé par l'administration">check_circle</mat-icon>
              <mat-icon *ngIf="devoirEnAttenteValidation(2)" class="icon-lock icon-attente" matTooltip="Verrouillé, en attente de validation admin">hourglass_top</mat-icon>
              <button
                *ngIf="!readonly && verrouillageActifPourEdition && devoirEstProchain(2)"
                type="button"
                class="btn-terminer"
                [disabled]="verrouillageEnCours || !peutVerrouillerDevoir(2)"
                (click)="onVerrouillerDevoir(2)"
                [matTooltip]="
                  peutVerrouillerDevoir(2)
                    ? 'Verrouiller ce devoir : plus aucune modification possible ensuite'
                    : 'Le 1er devoir doit d\'abord être validé par l\'administration'
                "
              >
                <mat-icon>lock_open</mat-icon>
                Terminer
              </button>
            </div>
          </th>
          <th class="col-moyenne">Moyenne</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let el of elevesFiltres">
          <td class="col-eleve">{{ el.nom }} {{ el.prenom }}</td>
          <td
            class="col-note"
            *ngFor="let i of interrogationIndices"
            [class.col-verrouillee]="interrogationVerrouillee(i + 1)"
            [class.col-en-attente]="interrogationEnAttente(i + 1)"
          >
            <input
              type="text"
              inputmode="decimal"
              [value]="el.interrogations[i]"
              (input)="onSaisieInterrogation(el, i, $event)"
              [disabled]="readonly || !interrogationEditable(i + 1)"
            />
          </td>
          <td class="col-note" [class.col-verrouillee]="devoirVerrouille(1)" [class.col-en-attente]="devoirEnAttente(1)">
            <input
              type="text"
              inputmode="decimal"
              [value]="el.devoir1"
              (input)="onSaisieDevoir(el, 1, $event)"
              [disabled]="readonly || !devoirEditable(1)"
            />
          </td>
          <td class="col-note" [class.col-verrouillee]="devoirVerrouille(2)" [class.col-en-attente]="devoirEnAttente(2)">
            <input
              type="text"
              inputmode="decimal"
              [value]="el.devoir2"
              (input)="onSaisieDevoir(el, 2, $event)"
              [disabled]="readonly || !devoirEditable(2)"
            />
          </td>
          <td class="col-moyenne">
            <span class="moyenne-value">{{ calculerMoyenne(el) | number: '1.2-2' }}</span>
          </td>
        </tr>
        <tr *ngIf="eleves.length === 0">
          <td [attr.colspan]="4 + nombreInterrogations" class="empty-row">Aucun élève dans cette classe.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
