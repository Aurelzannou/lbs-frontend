<div class="rfm-dialog">
  <div class="rfm-card">

    <div class="rfm-header">
      <div class="rfm-header-inner">
        <div class="rfm-title-group">
          <div class="rfm-icon-box" [ngClass]="isEdit ? 'edit' : 'create'">
            <mat-icon>school</mat-icon>
          </div>
          <div>
            <h3 class="rfm-title">{{ isEdit ? 'Modifier l\'Élève' : 'Nouvel Élève' }}</h3>
            <p class="rfm-subtitle">{{ isEdit ? 'Mise à jour du dossier scolaire' : 'Saisie d\'un nouvel élève dans la base' }}</p>
          </div>
        </div>
        <button mat-icon-button class="rfm-close" (click)="onCancel()">
          <mat-icon>close</mat-icon>
        </button>
      </div>
    </div>

    <div class="rfm-body">
      <form [formGroup]="form" class="rfm-form">

        <div class="rfm-row two-cols">
          <div class="rfm-field">
            <span class="rfm-label">Nom de famille</span>
            <mat-form-field appearance="outline">
              <mat-icon matPrefix>notes</mat-icon>
              <input matInput formControlName="nom" placeholder="Ex: KOFFI" style="text-transform: uppercase">
            </mat-form-field>
          </div>
          <div class="rfm-field">
            <span class="rfm-label">Prénom(s)</span>
            <mat-form-field appearance="outline">
              <mat-icon matPrefix>person</mat-icon>
              <input matInput formControlName="prenom" placeholder="Ex: Jean-Eudes">
            </mat-form-field>
          </div>
        </div>

        <div class="rfm-row two-cols">
          <div class="rfm-field rfm-select">
            <span class="rfm-label">Sexe</span>
            <ng-select [items]="sexes"
                       bindLabel="label"
                       bindValue="value"
                       formControlName="sexe"
                       placeholder="Genre de l'élève">
            </ng-select>
          </div>
          <div class="rfm-field rfm-date">
            <span class="rfm-label">
              Date de Naissance
              <span class="age-hint" *ngIf="calculatedAge !== null">({{ calculatedAge }} ans)</span>
            </span>
            <input type="date" formControlName="dateNaissance">
          </div>
        </div>

        <div class="rfm-row">
          <div class="rfm-field rfm-select">
            <span class="rfm-label">Classe d'affectation</span>
            <ng-select [items]="classes"
                       bindLabel="code"
                       bindValue="id"
                       formControlName="classeId"
                       placeholder="Sélectionnez la classe...">
            </ng-select>
          </div>
        </div>

        <div class="rfm-row">
          <div class="rfm-field">
            <span class="rfm-label">Provenance / École d'origine</span>
            <mat-form-field appearance="outline">
              <mat-icon matPrefix>home</mat-icon>
              <input matInput formControlName="provenance" placeholder="Ex: École Primaire Publique de ...">
            </mat-form-field>
          </div>
        </div>

        <div class="rfm-row">
          <label class="eleve-check">
            <input type="checkbox" formControlName="souffrant">
            <span>L'élève présente-t-il des problèmes de santé ?</span>
          </label>
        </div>

      </form>
    </div>

    <div class="rfm-footer">
      <div class="rfm-actions">
        <button mat-button class="rfm-cancel" (click)="onCancel()" [disabled]="loading">Annuler</button>
        <button mat-flat-button class="rfm-submit" (click)="onSubmit()" [disabled]="form.invalid || loading">
          <mat-icon *ngIf="!loading">save</mat-icon>
          {{ isEdit ? 'Mettre à jour' : 'Enregistrer' }}
        </button>
      </div>
    </div>

  </div>
</div>
