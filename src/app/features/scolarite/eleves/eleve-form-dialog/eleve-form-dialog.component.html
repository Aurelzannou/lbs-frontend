<nb-card class="form-card large-card">
    <nb-card-header class="form-header">
      <div class="header-content">
        <div class="title-with-icon">
          <div class="icon-box" [ngClass]="isEdit ? 'edit-mode' : 'create-mode'">
            <nb-icon [icon]="isEdit ? 'edit-2-outline' : 'person-add-outline'"></nb-icon>
          </div>
          <div class="title-text">
            <h3>{{ isEdit ? 'Modifier' : 'Nouvel' }} Élève</h3>
            <p class="subtitle">{{ isEdit ? 'Mise à jour du dossier scolaire' : 'Saisie d\'un nouvel élève dans la base' }}</p>
          </div>
        </div>
        <button nbButton ghost status="basic" (click)="onCancel()" class="close-btn">
          <nb-icon icon="close-outline"></nb-icon>
        </button>
      </div>
    </nb-card-header>

    <nb-card-body class="form-body">
      <form [formGroup]="form" class="professional-form">
        
        <!-- Identité -->
        <div class="form-row">
          <div class="form-field col-6">
            <label class="field-label">Nom de famille</label>
            <nb-form-field>
              <nb-icon nbPrefix icon="text-outline" pack="eva"></nb-icon>
              <input nbInput 
                     fullWidth 
                     shape="semi-round" 
                     formControlName="nom" 
                     placeholder="Ex: KOFFI"
                     style="text-transform: uppercase"
                     [status]="form.get('nom')?.invalid && form.get('nom')?.touched ? 'danger' : 'basic'">
            </nb-form-field>
          </div>
          <div class="form-field col-6">
            <label class="field-label">Prénom(s)</label>
            <nb-form-field>
              <nb-icon nbPrefix icon="person-outline" pack="eva"></nb-icon>
              <input nbInput 
                     fullWidth 
                     shape="semi-round" 
                     formControlName="prenom" 
                     placeholder="Ex: Jean-Eudes"
                     [status]="form.get('prenom')?.invalid && form.get('prenom')?.touched ? 'danger' : 'basic'">
            </nb-form-field>
          </div>
        </div>

        <!-- Sexe & Naissance -->
        <div class="form-row">
          <div class="form-field col-6">
            <label class="field-label">Sexe</label>
            <ng-select [items]="sexes"
                       bindLabel="label"
                       bindValue="value"
                       formControlName="sexe"
                       placeholder="Genre de l'élève"
                       class="custom-ng-select">
            </ng-select>
          </div>
          <div class="form-field col-6">
            <label class="field-label">
              Date de Naissance 
              <span class="age-hint" *ngIf="calculatedAge !== null">
                ({{ calculatedAge }} ans)
              </span>
            </label>
            <nb-form-field>
              <nb-icon nbPrefix icon="calendar-outline" pack="eva"></nb-icon>
              <input nbInput 
                     fullWidth 
                     type="date"
                     shape="semi-round" 
                     formControlName="dateNaissance" 
                     [status]="'basic'">
            </nb-form-field>
          </div>
        </div>

        <!-- Classe & Scolarité -->
        <div class="form-row">
          <div class="form-field col-12">
            <label class="field-label">Classe d'affectation</label>
            <ng-select [items]="classes"
                       bindLabel="code"
                       bindValue="id"
                       formControlName="classeId"
                       placeholder="Sélectionnez la classe..."
                       class="custom-ng-select">
            </ng-select>
          </div>
        </div>

        <!-- Provenance -->
        <div class="form-row">
          <div class="form-field col-12">
            <label class="field-label">Provenance / École d'origine</label>
            <nb-form-field>
              <nb-icon nbPrefix icon="home-outline" pack="eva"></nb-icon>
              <input nbInput 
                     fullWidth 
                     shape="semi-round" 
                     formControlName="provenance" 
                     placeholder="Ex: École Primaire Publique de ..."
                     [status]="'basic'">
            </nb-form-field>
          </div>
        </div>

        <!-- État de santé -->
        <div class="form-row" style="margin-top: 0.5rem;">
          <div class="form-field col-12">
            <div class="checkbox-wrapper">
              <input type="checkbox" id="souffrant" formControlName="souffrant" class="custom-checkbox">
              <label for="souffrant" class="checkbox-label">L'élève présente-t-il des problèmes de santé ?</label>
            </div>
          </div>
        </div>

      </form>
    </nb-card-body>

    <nb-card-footer class="form-footer">
      <div class="footer-actions">
        <button nbButton 
                status="basic" 
                appearance="ghost"
                (click)="onCancel()" 
                [disabled]="loading"
                class="cancel-btn">
          Annuler
        </button>
        <button nbButton 
                status="primary" 
                shape="semi-round"
                (click)="onSubmit()" 
                [disabled]="form.invalid || loading" 
                [nbSpinner]="loading" 
                nbSpinnerStatus="control"
                class="submit-btn shadow-btn">
          <nb-icon icon="save-outline" *ngIf="!loading"></nb-icon>
          {{ isEdit ? 'Mettre à jour' : 'Enregistrer' }}
        </button>
      </div>
    </nb-card-footer>
  </nb-card>
