<div class="dialog-container">
  <div class="dialog-header">
    <h3>{{ isEdit ? 'Modifier le Dossier' : 'Nouvelle Inscription' }}</h3>
    <button class="close-btn" (click)="dialogRef.close()">
      <nb-icon icon="close-outline"></nb-icon>
    </button>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="dialog-content">
    <div class="form-grid">
      <!-- Élève -->
      <div class="form-field full-width">
        <label>Élève</label>
        <nb-select fullWidth placeholder="Sélectionner l'élève" formControlName="eleveId">
          <nb-option *ngFor="let e of eleves" [value]="e.id">{{ e.nom }} {{ e.prenom }}</nb-option>
        </nb-select>
      </div>

      <!-- Classe -->
      <div class="form-field">
        <label>Classe</label>
        <nb-select fullWidth placeholder="Classe" formControlName="classeId">
          <nb-option *ngFor="let c of classes" [value]="c.id">{{ c.libelle }} ({{ c.code }})</nb-option>
        </nb-select>
      </div>

      <!-- Année Scolaire -->
      <div class="form-field">
        <label>Année Scolaire</label>
        <nb-select fullWidth placeholder="Année" formControlName="anneeScolaireId">
          <nb-option *ngFor="let a of annees" [value]="a.id">{{ a.code }}</nb-option>
        </nb-select>
      </div>

    </div>

    <div class="dialog-footer">
      <button nbButton status="basic" type="button" (click)="dialogRef.close()">Annuler</button>
      <button nbButton status="primary" type="submit" [disabled]="form.invalid || loading" [nbSpinner]="loading">
        {{ isEdit ? 'Enregistrer' : 'Créer le Dossier' }}
      </button>
    </div>
  </form>
</div>
