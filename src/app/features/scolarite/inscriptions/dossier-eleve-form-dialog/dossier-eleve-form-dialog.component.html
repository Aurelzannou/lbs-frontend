<mat-card class="dialog-card">
  <mat-card-header>
    <div class="header-content">
      <h3>{{ isEdit ? 'Modifier le Dossier' : 'Nouvelle Inscription' }}</h3>
      <button mat-icon-button (click)="dialogRef.close()">
        <mat-icon></mat-icon>
      </button>
    </div>
  </mat-card-header>

  <mat-card-content>
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="dialog-content">
      <div class="form-grid">
        <!-- Élève -->
        <div class="form-field full-width">
          <label>Élève</label>
          <mat-select placeholder="Sélectionner l'élève" formControlName="eleveId">
            <mat-option *ngFor="let e of eleves" [value]="e.id">{{ e.nom }} {{ e.prenom }}</mat-option>
          </mat-select>
        </div>

        <!-- Classe -->
        <div class="form-field">
          <label>Classe</label>
          <mat-select placeholder="Classe" formControlName="classeId">
            <mat-option *ngFor="let c of classes" [value]="c.id">{{ c.libelle }} ({{ c.code }})</mat-option>
          </mat-select>
        </div>

        <!-- Année Scolaire -->
        <div class="form-field">
          <label>Année Scolaire</label>
          <mat-select placeholder="Année" formControlName="anneeScolaireId">
            <mat-option *ngFor="let a of annees" [value]="a.id">{{ a.code }}</mat-option>
          </mat-select>
        </div>
      </div>

      <div class="dialog-footer">
        <button mat-button status="basic" type="button" (click)="dialogRef.close()">Annuler</button>
        <button mat-button status="primary" type="submit" [disabled]="form.invalid || loading">
          {{ isEdit ? 'Enregistrer' : 'Créer le Dossier' }}
        </button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
