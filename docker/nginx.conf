# Configuration nginx pour servir l'application Angular en production
# et relayer les appels /api vers le backend Spring Boot.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Taille max des uploads (le backend accepte 10 Mo de multipart)
    client_max_body_size 12m;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json application/xml
        image/svg+xml font/woff2;

    # Résolveur DNS interne de Docker : permet à nginx de démarrer même si le
    # backend n'est pas encore prêt, et de re-résoudre son adresse à chaud.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # --- API : relais vers le backend ---
    location /api/ {
        set $upstream_backend http://backend:8082;
        proxy_pass $upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # --- Fichiers de configuration d'exécution : jamais mis en cache ---
    location = /env.js {
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
    }
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
    }
    location = /silent-check-sso.html {
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
    }

    # --- PWA : le service worker et son manifeste de hash doivent toujours être
    #     revalidés, sinon les mises à jour de l'app ne sont jamais détectées.
    #     (Ils passeraient sinon dans la règle "assets versionnés" plus bas et
    #     seraient figés 30 jours.) ---
    location = /ngsw-worker.js {
        add_header Cache-Control "no-cache";
        expires -1;
    }
    location = /ngsw.json {
        add_header Cache-Control "no-cache";
        expires -1;
    }
    location = /safety-worker.js {
        add_header Cache-Control "no-cache";
        expires -1;
    }

    # --- PWA : le manifeste doit être servi avec le bon type MIME, sinon
    #     Chrome refuse d'installer l'application. ---
    location = /manifest.webmanifest {
        types { } default_type application/manifest+json;
        add_header Cache-Control "public, max-age=3600";
    }

    # --- Assets versionnés (hash dans le nom) : cache long ---
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # --- Routage SPA : tout le reste renvoie index.html ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Sécurité de base
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
